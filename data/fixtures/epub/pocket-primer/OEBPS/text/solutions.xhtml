  <h1>Solutions</h1>
  <p class="solution"><a id="sol1" href="exercises.xhtml#ex1"><b>1</b></a> <b>1.b6!</b> Kf7 2.b7 Ke7 3.b8=Q. The black king stands outside the square of the pawn and is a move too slow.</p>
  <p class="solution"><a id="sol2" href="exercises.xhtml#ex2"><b>2</b></a> <b>1...Rb6!</b> The rook takes the third rank. After 2.e6 Rb1 it checks the white king from behind: 3.Kf6 Rf1+ 4.Ke5 Re1+ and White cannot escape the checks.</p>
