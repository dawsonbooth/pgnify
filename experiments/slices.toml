# The evaluation's slices, each run on a clipped source: pages of a book in the local manifest,
# data/local/manifest.toml (its shape: data/local/manifest.example.toml), cut by
# experiments/cut.py into data/local/cuts/. Each slice has a truth, a reference PGN built and
# checked by hand, or says how it is checked instead. A slice that names a source instead of a
# cut is a whole book, which only a
# real-client session converts (experiments/client_session.py), and it has an inventory instead
# of a truth (experiments/score_book.py). Cuts, truths and inventories hold the books' words, so
# they stay local, under data/local/, which is not tracked.

# The output conventions every session asks for, as a user might; pgnify's instructions leave
# conventions to the user.
conventions = """An exercise and its solution, wherever the book prints the solution, as one game: \
the exercise's position, then the solution's moves. Round, "chapter.game" as the book numbers \
them, "?" for what it does not number. ChapterName, the chapter's title."""

[cuts.workbook-forks]
source = "everyones-first-chess-workbook"
# Chapter 5, Forks, and Part IV, Solutions to Exercises.
pages = [[175, 227], [862, 957]]

[cuts.logical-chess-14]
source = "logical-chess"
# Game 14 alone.
pages = [[137, 148]]

[cuts.logical-chess-12]
source = "logical-chess"
# Game 12 alone.
pages = [[122, 128]]

[cuts.wct-skewer]
source = "winning-chess-tactics"
# Chapter Four, The Skewer, printed pages 47 to 49, and Chapter Twenty-Four, Solutions to Tests
# from Part 1, printed pages 205 to 221.
pages = [[54, 56], [201, 217]]

[cuts.wcs-chapter-four]
source = "winning-chess-strategies"
# Chapter Four, Understanding Where the Pieces Go, as PyMuPDF lays out the EPUB.
pages = [[46, 103]]

[cuts.structures-smoke]
source = "chess-structures"
# The opening of Chapter 1, The Isolani, and the start of its first game: the book's pages 12
# and 13, a scan whose text Acrobat's ClearScan replaced.
pages = [[13, 14]]

[cuts.structures-10-36]
source = "chess-structures"
# The Introduction and Chapter 1, The Isolani: the book's pages 9 to 35.
pages = [[10, 36]]

[cuts.structures-37-69]
source = "chess-structures"
# Chapter 2, Hanging Pawns, and Chapter 3, Caro-Kann Formation: the book's pages 36 to 68.
pages = [[37, 69]]

[cuts.perfect]
source = "perfect-your-chess"
# The Preface, the Introduction, Make a Move's opening and its first eleven exercises, and their
# solutions: a scan without a text layer, whose printed page numbers are pgnify's.
pages = [[5, 10], [30, 32]]

[cuts.woodpecker]
source = "woodpecker-method"
# The Summary of Tactical Motifs, Chapter 1's opening page with Easy Exercises 1 to 12, and
# Chapter 4's opening page with their solutions: the book's pages 21 to 25, 31 to 33 and 223 to
# 225, a born-digital PDF whose diagrams are set in a chess font.
pages = [[22, 26], [32, 34], [224, 226]]

# The part each slice's prompt names, in the book's own terms, and its truth.

[slices.workbook-rook-forks]
cut = "workbook-forks"
part = "Chapter 5, Forks: the rook forks, with the solutions to their exercises"
# The part as a real-client session asks for it, in the whole book
# (experiments/client_session.py).
client_part = "the rook forks in Chapter 5, Forks, with their examples, their exercises and the solutions to those exercises"
truth = "data/local/truth/workbook-rook-forks.pgn"

# The whole of Chapter 5, for scale: its six basic examples and Exercises 115 to 156, with
# their solutions. Its real-client session has a higher safety ceiling on cost than the
# launcher's: a guard against runaway work, not a target.
[slices.workbook-forks]
cut = "workbook-forks"
part = "Chapter 5, Forks, with its examples and the solutions to its exercises"
client_part = "Chapter 5, Forks, with its examples, its exercises and the solutions to those exercises"
truth = "data/local/truth/workbook-forks.pgn"
client_ceiling_usd = 10.0

[slices.logical-chess-14]
cut = "logical-chess-14"
part = "Game 14, Tarrasch – Mieses, Berlin 1916, with all its notes"
truth = "data/local/truth/logical-chess-14.pgn"

[slices.wct-skewer]
cut = "wct-skewer"
part = "Chapter Four, The Skewer, with the solutions to its tests"
truth = "data/local/truth/wct-skewer.pgn"

# Game 12, a game with 20 variations given in its notes.
[slices.logical-chess-12]
cut = "logical-chess-12"
part = "Game 12, Pitschak – Flohr, Liebwerda 1934, with all its notes"
truth = "data/local/truth/logical-chess-12.pgn"

# The whole of Winning Chess Strategies, the first book converted whole: its 148 diagrams, 26
# tests and their solutions, its games and its commentary. Its real-client session has a higher
# safety ceiling on cost: a guard against runaway work, not a target.
[slices.winning-chess-strategies]
source = "winning-chess-strategies"
client_part = "the whole book, with every game, position, test and solution, the variations it gives and its commentary word for word"
inventory = "data/local/inventory/winning-chess-strategies.json"
client_ceiling_usd = 50.0

# A smoke test of one exercise, to check the session launcher, the clipped source and the tools.
# Scored against the rook forks' truth, of which it should find one game.
[slices.workbook-smoke]
cut = "workbook-forks"
part = "Chapter 5, Forks: Exercise 126, with its solution"
truth = "data/local/truth/workbook-rook-forks.pgn"

# Chapter Four of Winning Chess Strategies, to check the conversion instructions that keep all
# of a book's chess prose: the chapter's introduction and its six section introductions, which
# the whole book's run left out under the earlier instructions, and its cases of the main line
# and of variations. A real-client session only, with no truth: data/local/checks/
# check_chapter.py checks it against the book's inventory, its XHTML and the publisher's
# movetext. The safety ceiling on cost guards against runaway work and is no target.
[slices.wcs-chapter-four]
cut = "wcs-chapter-four"
part = "Chapter Four, Understanding Where the Pieces Go"
client_ceiling_usd = 15.0

# A smoke run of pgnify's page picture tool, doc_page, on a scanned PDF whose text layer garbles
# its figurines: the chapter's introduction, its plans and its structure diagram, which has no
# kings, and the first game to the end of page 14, with its variations and two diagrams. A
# real-client session only; data/local/truth/structures-smoke.md says how it is checked.
[slices.structures-smoke]
cut = "structures-smoke"
part = "pages 13 and 14, as pgnify's tools number them: the opening of Chapter 1, The Isolani, and its first game as far as page 14 goes"
truth = "data/local/truth/structures-smoke.pgn"

# The validation that follows the smoke: the Introduction and the whole of Chapter 1, The
# Isolani, with its eight games, a fragment that starts from a diagram, its prose and its
# diagrams, some pictures holding more than one board. A real-client session only;
# data/local/truth/structures-10-36.md says how it is checked. The safety ceiling on cost guards
# against runaway work and is no target.
[slices.structures-10-36]
cut = "structures-10-36"
part = "pages 10 to 36, as pgnify's tools number them: the Introduction and Chapter 1, The Isolani"
truth = "data/local/truth/structures-10-36.pgn"
client_ceiling_usd = 15.0

# The second validation, on pages the first did not see: Chapter 2, Hanging Pawns, and Chapter
# 3, Caro-Kann Formation, with twelve games, their prose and their diagrams. It tests the
# instructions that followed the first: marks read from close-ups, column and page tops checked,
# no marks made from words, and an audit before a part is called complete. Its request is the
# same as any other's. A real-client session only; data/local/truth/structures-37-69.md says how
# it is checked. The safety ceiling on cost guards against runaway work and is no target.
[slices.structures-37-69]
cut = "structures-37-69"
part = "pages 37 to 69, as pgnify's tools number them: Chapter 2, Hanging Pawns, and Chapter 3, Caro-Kann Formation"
truth = "data/local/truth/structures-37-69.pgn"
client_ceiling_usd = 15.0

# The validation of PDFs whose diagrams are set in a chess font: a born-digital Quality Chess book
# whose figurines and marks come through its text layer as its fonts' own codes, with a key to
# symbols on page 5, six diagrams to a page, and exercises whose solutions are printed about 190
# pages later. Its request names the part alone. A real-client session only;
# data/local/truth/woodpecker.md says how it is checked. The safety ceiling on cost guards against
# runaway work and is no target.
[slices.woodpecker]
cut = "woodpecker"
part = "pages 22 to 26, 32 to 34 and 224 to 226, as pgnify's tools number them: the Summary of Tactical Motifs, the opening of Chapter 1 with Easy Exercises 1 to 12, and those twelve exercises' solutions in Chapter 4"
truth = "data/local/truth/woodpecker.pgn"
client_ceiling_usd = 5.0


# The validation of scans without a text layer: every word, move and mark read from the page's
# picture, prose with epigraphs and numbered lists, a paragraph that runs on from one page to the
# next, five and six diagrams to a page with the side to move printed as a letter, and dense
# two-column figurine solutions printed twenty pages after their exercises, one of them holding a
# diagram. Its request names the part alone. A real-client session only;
# data/local/truth/perfect.md says how it is checked. The safety ceiling on cost guards against
# runaway work and is no target.
[slices.perfect]
cut = "perfect"
part = "pages 5 to 10 and 30 to 32, as pgnify's tools number them: the Preface, the Introduction, the opening of Make a Move with its first eleven exercises, and those exercises' solutions"
truth = "data/local/truth/perfect.pgn"
client_ceiling_usd = 8.0
