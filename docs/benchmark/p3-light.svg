<svg xmlns="http://www.w3.org/2000/svg" width="804" height="706" viewBox="0 0 804 706" role="img" aria-labelledby="t d">
<title id="t">P3: substantive faults against cost, per configuration</title>
<desc id="d">Nine small panels, one per configuration on P3 (Silman, Complete Endgame Course, Part Four). In each panel, every run is a dot. Its position gives the run's cost at list price (log scale, $2 to $16) and its substantive faults (0 to 100). A gray band shows Sonnet 5.5 at high effort's three runs, 41 to 72 faults. Opus 5.5 at high effort's third run, 705 faults, appears at the top edge. The figures are in the tables of docs/benchmark.md.</desc>
<rect width="804" height="706" fill="#fcfcfb"/>
<g font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<text x="44" y="28" font-size="15" font-weight="600" fill="#0b0b0b">P3: substantive faults against cost, per configuration</text>
<text x="44" y="50" font-size="12" fill="#52514e">The gray band spans Sonnet 5.5 at high effort's three runs (41–72 faults); gray dots mark those runs. Lower is better.</text>
<text x="44" y="68" font-size="12" fill="#52514e">Three runs differ from the band only if all three fall on one side of it. One run cannot show a difference.</text>
<text x="44" y="86" font-size="12" fill="#52514e">B, C and D: Sonnet 5.5 at high with a survey, another session's map, or delegation to subagents.</text>
<text x="44" y="104" font-size="12" fill="#52514e">C-verified's map came from the reference PGN.</text>
